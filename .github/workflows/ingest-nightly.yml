name: Nightly Ingestion

on:
  schedule:
    - cron: "0 6 * * *"  # 6am UTC daily
  workflow_dispatch:  # allow manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: buzzbot
          POSTGRES_PASSWORD: buzzbot_dev
          POSTGRES_DB: buzzbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U buzzbot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql://buzzbot:buzzbot_dev@localhost:5432/buzzbot

      - name: Run ingestion
        run: python -m ingestion.run_ingestion
        env:
          DATABASE_URL: postgresql+asyncpg://buzzbot:buzzbot_dev@localhost:5432/buzzbot
          DATABASE_URL_SYNC: postgresql://buzzbot:buzzbot_dev@localhost:5432/buzzbot
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: openai
          INGEST_MAX_URLS_PER_SOURCE: "100"
          INGEST_CONCURRENCY: "3"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-artifacts
          path: |
            artifacts/manifest.json
            artifacts/failed_urls.json
          retention-days: 30
