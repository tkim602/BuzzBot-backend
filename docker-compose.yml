version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: buzzbot-db
    environment:
      POSTGRES_USER: buzzbot
      POSTGRES_PASSWORD: buzzbot_dev
      POSTGRES_DB: buzzbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzzbot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
