# Controlled official-document registry. No generic gatech.edu crawl.
documents:
  - name: gt-registrar
    source_type: official_policy
    authority: registrar
    vertical: academics
    adapter: registrar
    allowed_roots: [https://registrar.gatech.edu/]
    seed_urls: [https://registrar.gatech.edu/registration]
    allowed_path_prefixes: [/registration]
    content_types: [text/html]
    freshness_class: medium
    profiles: [run3]
    max_urls: 50

