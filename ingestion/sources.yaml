# Controlled official-document registry. No generic gatech.edu crawl.
documents:
  - name: gt-registrar
    source_type: official_policy
    authority: registrar
    allowed_roots: [https://registrar.gatech.edu/]
    seed_urls: [https://registrar.gatech.edu/registration]
    max_urls: 50

  - name: gt-academic-calendar
    source_type: academic_calendar
    authority: academic_calendar
    allowed_roots: [https://registrar.gatech.edu/]
    seed_urls: [https://registrar.gatech.edu/current-academic-calendar]
    max_urls: 5

  - name: gt-catalog
    source_type: course_catalog
    authority: catalog
    allowed_roots: [https://catalog.gatech.edu/]
    seed_urls: [https://catalog.gatech.edu/coursesaz/]
    max_urls: 150

  - name: gt-omscs
    source_type: omscs_policy
    authority: omscs
    allowed_roots: [https://omscs.gatech.edu/]
    seed_urls:
      - https://omscs.gatech.edu/admission-criteria
      - https://omscs.gatech.edu/degree-requirements
      - https://omscs.gatech.edu/current-courses
      - https://omscs.gatech.edu/prospective-student-faqs
      - https://omscs.gatech.edu/specializations
      - https://omscs.gatech.edu/cost-and-payment-schedule
    max_urls: 10

  - name: gt-admission
    source_type: admissions
    authority: admissions
    allowed_roots: [https://admission.gatech.edu/first-year/]
    seed_urls:
      - https://admission.gatech.edu/first-year/
      - https://admission.gatech.edu/first-year/deadlines
      - https://admission.gatech.edu/first-year/application-review
      - https://admission.gatech.edu/first-year/academic-preparation
      - https://admission.gatech.edu/first-year/personal-essays
      - https://admission.gatech.edu/first-year/recommendations
      - https://admission.gatech.edu/first-year/major-selection
    max_urls: 30

blocked_sources:
  - name: ratemyprofessors
    reason: Automated scraping is excluded; user-provided excerpts only.
