[project]
name = "buzzbot-backend"
version = "0.1.0"
description = "RAG chatbot for Georgia Tech campus information"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "lxml>=5.1,<6",
    "trafilatura>=1.8,<2",
    "readability-lxml>=0.8,<1",
    "tiktoken>=0.6,<1",
    "openai>=1.12,<2",
    "langgraph>=1,<2",
    "langsmith>=0.11,<1",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "anthropic>=0.18,<1",
    "sentence-transformers>=2.5,<4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<26",
    "pdfplumber>=0.10,<1",
    "firebase-admin>=6.5,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<6",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
    "httpx",  # for TestClient
]

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/core/guardrails.py" = ["N818"]
"scripts/seed_sources.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
